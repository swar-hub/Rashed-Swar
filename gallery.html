    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #ffffff; 
            color: #222222; 
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        
        /* Header - Changed to Grid to prevent overlapping */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: grid;
            grid-template-columns: 1fr auto 1fr; /* 3 invisible columns */
            align-items: center;
            background: rgb(1, 1, 15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 100;
        }

        /* Language Button - Left Column */
        .lang-btn {
            grid-column: 1;
            justify-self: start;
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 0.4rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: 0.3s;
            z-index: 102;
        }

        .lang-btn:hover {
            background: white;
            color: navy;
        }

        
        .logo {
            grid-column: 2;
            justify-self: center;
            font-family: 'Rakkas', serif;
            font-size: 2.5rem;
            color: #ffffff; 
            text-decoration: none;
            letter-spacing: 1px;
            z-index: 102; 
            white-space: nowrap;
        }

        
        .menu-icon {
            grid-column: 3;
            justify-self: end;
            display: none;
            font-size: 2rem;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
        }

        
        nav {
            grid-column: 3;
            justify-self: end;
            display: flex;
            align-items: center;
            background: transparent;
            padding: 0;
        }

        nav a {
            color: #e0e0e0; 
            text-decoration: none;
            margin: 0;
            margin-inline-start: 1.5rem; /* Spacing between links */
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
        }

        
        .home {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 6rem 5% 2rem;
            gap: 2rem;
        }

        .home-content {
            flex: 1;
            max-width: 600px;
        }

        .home-content h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: #111111; 
        }

        .home-content .typing-text {
            font-size: 1.8rem;
            color: #555555; 
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .home-content p {
            font-size: 1.2rem;
            color: #444444; 
            line-height: 1.6;
        }

        .home-img {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .home-img img {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        
        #vr-museum h2 {
            color: #111111;
        }

        #vr-museum-container {
            width: 100%;
            height: 80vh;
            background-color: #111;
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            overflow: hidden;
        }

        
        /* Responsive Design (Mobile & Tablets) */
        @media (max-width: 850px) {
            /* Show Hamburger Menu */
            .menu-icon {
                display: block; 
            }

            /* Turn Navigation into Dropdown */
            nav {
                position: absolute;
                top: 100%; 
                left: 0;
                width: 100%;
                background: rgba(1, 1, 15, 0.192); 
                backdrop-filter: blur(10px);
                flex-direction: column;
                align-items: center;
                padding: 2rem 0;
                display: none; /* Hidden until hamburger is clicked */
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }

            nav.active {
                display: flex; 
            }

            nav a {
                margin: 1.2rem 0; 
                margin-inline-start: 0;
                font-size: 1.5rem;
            }

            .home {
                flex-direction: column-reverse;
                text-align: center;
                padding-top: 8rem;
            }
            .home-content h1 {
                font-size: 3rem;
            }
        }
    </style>

    <script>
        const menuIcon = document.getElementById('menu-icon');
        const navMenu = document.getElementById('nav-menu');

        menuIcon.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });
        
        const langBtn = document.getElementById('lang-toggle');
        const translatableElements = document.querySelectorAll('[data-en]');
        let isEnglish = true;

        langBtn.addEventListener('click', () => {
            isEnglish = !isEnglish;
            
            if (isEnglish) {
                document.body.dir = 'ltr';
                langBtn.textContent = 'عربي';
                translatableElements.forEach(el => {
                    el.textContent = el.getAttribute('data-en');
                });
            } else {
                document.body.dir = 'rtl';
                langBtn.textContent = 'English';
                translatableElements.forEach(el => {
                    el.textContent = el.getAttribute('data-ar');
                });
            }
        });
    </script>

        imageNames.forEach((fileName) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'gallery-item';
            
            const img = document.createElement('img');
            img.src = `${folderPath}${fileName}`; 
            img.alt = `Rashed Swar Artwork - ${fileName}`;
            img.className = 'artwork';

            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const fontSize = Math.max(36, canvas.width * 0.03);
                ctx.font = `${fontSize}px "Segoe UI", sans-serif`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';


                ctx.save(); 


                ctx.translate(canvas.width / 2, canvas.height / 2);


                ctx.rotate(-Math.PI / 4);


                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                ctx.fillText(watermarkText, 0, 0);


                ctx.restore();

                img.src = canvas.toDataURL('image/jpeg', 0.92); 
                img.classList.add('watermarked');

                
                img.onload = null; 
            };

            itemDiv.appendChild(img);
            galleryContainer.appendChild(itemDiv);
        });
